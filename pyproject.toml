[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphyco"
version = "0.1.0"
description = "Computational graph topology and dynamic gradient-flow monitoring for PyTorch"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
gui = ["PySide6"]
query = ["pandas>=2.0"]
dev = ["pytest>=7.0", "pandas>=2.0", "PySide6"]
all = ["PySide6", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/fthyco/GRAPHyco"
Repository = "https://github.com/fthyco/GRAPHyco"
Issues = "https://github.com/fthyco/GRAPHyco/issues"

[project.scripts]
graphyco = "graphyco.visualizer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/graphyco/tests"]
